<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPC 2026 - Volunteer Registration | Bologna</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="it">IT</button>
  </div>

  <!-- Header with Logos -->
  <header class="header">
    <div class="header-top">
      <img src="assets/logo-alma.svg" alt="Alma Mater Studiorum - University of Bologna" class="logo-alma">
      <img src="assets/epc-2026-poster.png" alt="European Population Conference 2026" class="logo-epc">
    </div>
    <div class="hero">
      <h1 data-en="Volunteer with Us!" data-it="Diventa Volontario!"></h1>
      <p class="subtitle" data-en="European Population Conference 2026" data-it="Conferenza Europea sulla Popolazione 2026"></p>
      <p class="date-location" data-en="3&ndash;6 June 2026 &middot; Bologna, Italy" data-it="3&ndash;6 Giugno 2026 &middot; Bologna, Italia"></p>
      <a href="#signup" class="cta-button" data-en="Sign Up as a Volunteer" data-it="Iscriviti come Volontario"></a>
    </div>
  </header>

  <!-- About -->
  <main class="container">
    <section id="about">
      <h2 data-en="About the Conference" data-it="La Conferenza"></h2>
      <p data-en="The European Population Conference (EPC) is the flagship event of the European Association for Population Studies (EAPS). In 2026, the conference will be hosted by the <strong>University of Bologna</strong> &mdash; the oldest university in the world, founded in 1088."
         data-it="La European Population Conference (EPC) &egrave; l&rsquo;evento principale della European Association for Population Studies (EAPS). Nel 2026, la conferenza sar&agrave; ospitata dall&rsquo;<strong>Universit&agrave; di Bologna</strong> &mdash; la pi&ugrave; antica universit&agrave; del mondo, fondata nel 1088."></p>
      <p data-en="Researchers, policymakers, and practitioners from across the globe will gather to discuss the latest developments in population studies, demography, and related fields."
         data-it="Ricercatori, decisori politici e professionisti da tutto il mondo si riuniranno per discutere gli ultimi sviluppi negli studi sulla popolazione, la demografia e i campi correlati."></p>
    </section>

    <!-- Why Volunteer -->
    <section id="why">
      <h2 data-en="Why Volunteer?" data-it="Perch&eacute; fare il Volontario?"></h2>
      <div class="card-grid">
        <div class="card">
          <h3 data-en="Networking" data-it="Networking"></h3>
          <p data-en="Connect with leading researchers and professionals from around the world in population studies."
             data-it="Entra in contatto con ricercatori e professionisti di fama mondiale nel campo degli studi sulla popolazione."></p>
        </div>
        <div class="card">
          <h3 data-en="Experience" data-it="Esperienza"></h3>
          <p data-en="Gain hands-on experience in organizing a major international academic conference."
             data-it="Acquisisci esperienza pratica nell&rsquo;organizzazione di un&rsquo;importante conferenza accademica internazionale."></p>
        </div>
        <div class="card">
          <h3 data-en="Certificate" data-it="Certificato"></h3>
          <p data-en="Receive a certificate of participation to add to your academic portfolio."
             data-it="Ricevi un certificato di partecipazione da aggiungere al tuo curriculum accademico."></p>
        </div>
        <div class="card">
          <h3 data-en="Free Access" data-it="Accesso Gratuito"></h3>
          <p data-en="Attend selected conference sessions and keynote presentations for free."
             data-it="Partecipa gratuitamente a sessioni selezionate della conferenza e alle presentazioni principali."></p>
        </div>
      </div>
    </section>

    <!-- Roles -->
    <section id="roles">
      <h2 data-en="Volunteer Roles" data-it="Ruoli dei Volontari"></h2>
      <div class="card-grid">
        <div class="card">
          <h3 data-en="Registration Desk" data-it="Reception"></h3>
          <p data-en="Welcome attendees, distribute conference materials, and assist with check-in."
             data-it="Accogliere i partecipanti, distribuire il materiale della conferenza e assistere nelle registrazioni."></p>
        </div>
        <div class="card">
          <h3 data-en="Session Support" data-it="Supporto alle Sessioni"></h3>
          <p data-en="Help with room setup, timekeeping, and technical equipment during sessions."
             data-it="Aiutare con l&rsquo;allestimento delle sale, la gestione dei tempi e le attrezzature tecniche durante le sessioni."></p>
        </div>
        <div class="card">
          <h3 data-en="Information Point" data-it="Punto Informazioni"></h3>
          <p data-en="Guide participants around the venue and answer questions about the programme."
             data-it="Guidare i partecipanti nella sede e rispondere alle domande sul programma."></p>
        </div>
      </div>
    </section>

    <!-- Sign Up Form -->
    <section id="signup">
      <div class="signup-section">
        <h2 data-en="Ready to Join?" data-it="Vuoi partecipare?"></h2>
        <p data-en="Fill out the form below to register as a volunteer. We will get back to you with available shifts and more details."
           data-it="Compila il modulo qui sotto per registrarti come volontario. Ti contatteremo con i turni disponibili e maggiori dettagli."></p>

        <form action="https://formsubmit.co/epc2026@unibo.it" method="POST" class="volunteer-form">
          <!-- FormSubmit config -->
          <input type="hidden" name="_subject" value="New EPC 2026 Volunteer Registration">
          <input type="hidden" name="_captcha" value="true">
          <input type="hidden" name="_template" value="table">
          <input type="text" name="_honey" style="display:none">

          <div class="form-grid">
            <div class="form-group">
              <label for="name" data-en="Full Name" data-it="Nome e Cognome"></label>
              <input type="text" id="name" name="name" required
                     data-placeholder-en="Enter your full name"
                     data-placeholder-it="Inserisci nome e cognome">
            </div>
            <div class="form-group">
              <label for="email" data-en="Email Address" data-it="Indirizzo Email"></label>
              <input type="email" id="email" name="email" required
                     data-placeholder-en="your.email@example.com"
                     data-placeholder-it="tua.email@esempio.com">
            </div>
            <div class="form-group">
              <label for="phone" data-en="Phone Number" data-it="Numero di Telefono"></label>
              <input type="tel" id="phone" name="phone"
                     data-placeholder-en="+39 ..."
                     data-placeholder-it="+39 ...">
            </div>
            <div class="form-group">
              <label for="affiliation" data-en="University / Affiliation" data-it="Universit&agrave; / Affiliazione"></label>
              <input type="text" id="affiliation" name="affiliation"
                     data-placeholder-en="e.g. University of Bologna"
                     data-placeholder-it="es. Universit&agrave; di Bologna">
            </div>
            <div class="form-group full-width">
              <label for="role" data-en="Preferred Role" data-it="Ruolo Preferito"></label>
              <select id="role" name="preferred_role">
                <option value="" data-en="-- Select a role --" data-it="-- Seleziona un ruolo --"></option>
                <option value="registration" data-en="Registration Desk" data-it="Reception"></option>
                <option value="session" data-en="Session Support" data-it="Supporto alle Sessioni"></option>
                <option value="info" data-en="Information Point" data-it="Punto Informazioni"></option>
                <option value="any" data-en="Any role (flexible)" data-it="Qualsiasi ruolo (flessibile)"></option>
              </select>
            </div>
            <div class="form-group full-width">
              <label for="availability" data-en="Availability (select the days)" data-it="Disponibilit&agrave; (seleziona i giorni)"></label>
              <div class="checkbox-group">
                <label class="checkbox-label">
                  <input type="checkbox" name="availability" value="June 3">
                  <span data-en="Wed 3 June" data-it="Mer 3 Giugno"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="availability" value="June 4">
                  <span data-en="Thu 4 June" data-it="Gio 4 Giugno"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="availability" value="June 5">
                  <span data-en="Fri 5 June" data-it="Ven 5 Giugno"></span>
                </label>
                <label class="checkbox-label">
                  <input type="checkbox" name="availability" value="June 6">
                  <span data-en="Sat 6 June" data-it="Sab 6 Giugno"></span>
                </label>
              </div>
            </div>
            <div class="form-group full-width">
              <label for="notes" data-en="Notes (optional)" data-it="Note (facoltativo)"></label>
              <textarea id="notes" name="notes" rows="3"
                        data-placeholder-en="Any additional information..."
                        data-placeholder-it="Eventuali informazioni aggiuntive..."></textarea>
            </div>
          </div>

          <button type="submit" class="submit-button" data-en="Submit Registration" data-it="Invia Registrazione"></button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>
      &copy; 2026 European Population Conference &middot;
      <a href="https://www.unibo.it" target="_blank">Alma Mater Studiorum &ndash; Universit&agrave; di Bologna</a>
    </p>
  </footer>

  <script src="assets/main.js"></script>
</body>
</html>
