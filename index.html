<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPC 2026 Photo Gallery &middot; Bologna</title>
  <style>
    :root {
      --bg: #16141a;
      --card: #211e27;
      --accent: #e8336d;
      --text: #f3f0f7;
      --muted: #a79fb3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 0.5rem; font-size: 1rem; }
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      background: rgba(22, 20, 26, 0.92);
      backdrop-filter: blur(8px);
    }
    nav button {
      background: var(--card);
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.55rem 1.3rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    nav button:hover { color: var(--text); }
    nav button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .count {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.6rem 0 0.2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 6px;
      padding: 1rem;
      max-width: 1500px;
      margin: 0 auto;
    }
    .grid a {
      display: block;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border-radius: 6px;
      background: var(--card);
    }
    .grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease, opacity 0.4s ease;
      opacity: 0;
    }
    .grid img.loaded { opacity: 1; }
    .grid a:hover img { transform: scale(1.04); }
    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 9, 12, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 94vw;
      max-height: 88vh;
      border-radius: 4px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.6);
    }
    .lightbox .caption {
      position: absolute;
      bottom: 1.2rem;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .lb-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--text);
      font-size: 1.8rem;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s;
      line-height: 1;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.18); }
    #lb-prev { left: 1rem; }
    #lb-next { right: 1rem; }
    #lb-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      transform: none;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 1rem 3rem;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; padding: 0.5rem; }
      .lb-btn { width: 42px; height: 42px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>EPC <span>2026</span> Photo Gallery</h1>
    <p>European Population Conference &middot; 3&ndash;6 June 2026 &middot; Bologna, Italy</p>
  </header>

  <nav id="tabs">
    <button data-day="day1" class="active">Day 1 &middot; 3 June</button>
    <button data-day="day2">Day 2 &middot; 4 June</button>
    <button data-day="day3">Day 3 &middot; 5 June</button>
    <button data-day="day4">Day 4 &middot; 6 June</button>
  </nav>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>

  <div class="lightbox" id="lightbox">
    <button class="lb-btn" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn" id="lb-prev" aria-label="Previous">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-btn" id="lb-next" aria-label="Next">&#8250;</button>
    <p class="caption" id="lb-caption"></p>
  </div>

  <footer>European Population Conference 2026 &middot; Bologna</footer>

  <script src="manifest.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbCaption = document.getElementById('lb-caption');
    const dayLabels = { day1: 'Day 1', day2: 'Day 2', day3: 'Day 3', day4: 'Day 4' };

    let currentDay = 'day1';
    let currentIndex = 0;

    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const img = entry.target;
        img.src = img.dataset.src;
        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        observer.unobserve(img);
      }
    }, { rootMargin: '400px' });

    function render(day) {
      currentDay = day;
      const files = PHOTOS[day] || [];
      grid.innerHTML = '';
      countEl.textContent = files.length + ' photos';
      files.forEach((name, i) => {
        const a = document.createElement('a');
        a.href = 'photos/' + day + '/' + name;
        a.addEventListener('click', e => { e.preventDefault(); openLightbox(i); });
        const img = document.createElement('img');
        img.dataset.src = 'thumbs/' + day + '/' + name;
        img.alt = dayLabels[day] + ' photo ' + (i + 1);
        img.loading = 'lazy';
        a.appendChild(img);
        grid.appendChild(a);
        observer.observe(img);
      });
      window.scrollTo({ top: 0 });
    }

    function openLightbox(i) {
      currentIndex = i;
      showCurrent();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    function showCurrent() {
      const files = PHOTOS[currentDay];
      const name = files[currentIndex];
      lbImg.src = 'photos/' + currentDay + '/' + name;
      lbCaption.textContent = dayLabels[currentDay] + ' · ' + (currentIndex + 1) + ' / ' + files.length;
    }

    function step(delta) {
      const files = PHOTOS[currentDay];
      currentIndex = (currentIndex + delta + files.length) % files.length;
      showCurrent();
    }

    document.querySelectorAll('#tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.day);
      });
    });

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lb-prev').addEventListener('click', () => step(-1));
    document.getElementById('lb-next').addEventListener('click', () => step(1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'ArrowRight') step(1);
    });

    render('day1');
  </script>
</body>
</html>
